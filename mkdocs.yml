site_name: "DOX"
site_description: "Dox is a fast web backend framework for Dart, like Laravel: routing, an ORM, migrations, typed validation, auth and a CLI, on a Rust HTTP server."
repo_url: https://github.com/dartondox/dox
edit_uri: edit/main/docs/
# /latest/ is where the newest docs live (mike). Canonical URLs and the
# sitemap use it, so search engines index the real pages, not the redirects.
site_url: https://dartondox.dev/latest/
copyright: Copyright &copy; 2023 - 2026 Dart On Dox
# broken links and anchors fail `mkdocs build --strict`
validation:
  anchors: warn
  unrecognized_links: warn
hooks:
  - hooks/docs_hooks.py
# `plugins:` turns off the default list, so `search` is named here.
# redirect_maps keeps old links working when a page moves.
plugins:
  - search
  - redirects:
      redirect_maps:
        database/model/serializer.md: the-basic/serializer.md
        the-basic/installation.md: getting-started/installation.md
        others/contribute.md: community/contribute.md
        others/mascot.md: community/mascot.md
extra_css:
  - assets/style.css
extra_javascript:
  - assets/script.js
extra:
  version:
    provider: mike
    alias: true
  analytics:
    provider: google
    property: G-GY82BXCJF8
  social:
    - icon: fontawesome/brands/github
      name: Github
      link: https://github.com/dartondox
theme:
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link
    - toc.follow
  font:
    text: Instrument Sans
    code: JetBrains Mono
  favicon: assets/favicon.png
  logo: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  name: material
  custom_dir: overrides
  language: en
  # follows the system setting first; the toggle cycles auto -> light -> dark
  palette:
  - media: "(prefers-color-scheme)"
    toggle:
      icon: material/brightness-auto
      name: Switch to light mode

  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode

  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: material/brightness-4
      name: Switch to system preference

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

