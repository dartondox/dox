site_name: "DOX"
repo_url: https://github.com/dartondox/dox
site_url: https://dartondox.dev
copyright: Copyright &copy; 2023 - 2026 Dart On Dox
# broken links and anchors fail `mkdocs build --strict`
validation:
  anchors: warn
  unrecognized_links: warn
extra_css:
  - assets/style.css
extra_javascript:
  - assets/script.js
extra:
  version:
    provider: mike
    alias: true
  analytics:
    provider: google
    property: G-GY82BXCJF8
  social:
    - icon: fontawesome/brands/github
      name: Github
      link: https://github.com/dartondox
theme:
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  font:
    text: Instrument Sans
    code: JetBrains Mono
  favicon: assets/favicon.png
  logo: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  name: material
  # follows the system setting first; the toggle cycles auto -> light -> dark
  palette:
  - media: "(prefers-color-scheme)"
    toggle:
      icon: material/brightness-auto
      name: Switch to light mode

  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode

  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: material/brightness-4
      name: Switch to system preference

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

