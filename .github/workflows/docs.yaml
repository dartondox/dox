name: Docs

# Versioned docs with mike (https://github.com/jimporter/mike).
# Each version lives in its own folder on the gh-pages branch:
#   /3.x/  docs from develop (alias /latest/, the default)
#   /2.x/  old docs, deployed by hand from the v2.x branch
# Old links like /the-basic/routing/ are kept as small redirect pages.
# See docs/others/contribute.md, section "Docs".

on:
  push:
    branches:
      - develop
    paths:
      - 'docs/**'
      - 'hooks/**'
      - 'overrides/**'
      - 'packages/*/CHANGELOG.md'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yaml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Docs version to deploy'
        type: choice
        options:
          - '3.x'
          - '2.x'
        default: '3.x'
      ref:
        description: 'Branch or tag to build 2.x from'
        default: 'v2.x'

permissions:
  contents: write

# two deploys must not push to gh-pages at the same time
concurrency:
  group: docs-deploy
  cancel-in-progress: false

env:
  MKDOCS_VERSION: '1.6.1'
  MATERIAL_VERSION: '9.7.7'
  MIKE_VERSION: '2.2.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.version == '2.x') && inputs.ref || github.ref }}
          fetch-depth: 0
          # The built-in GITHUB_TOKEN is used. It can push to gh-pages
          # because gh-pages is not protected.
          # Keep persist-credentials on (the default) so the git push works.
          token: ${{ github.token }}

      # The scripts in ci/ come from this workflow's commit. A 2.x deploy
      # checks out v2.x above, which has no ci/ folder.
      - name: Checkout the CI scripts
        uses: actions/checkout@v4
        with:
          path: .ci
          sparse-checkout: ci
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mkdocs, material and mike
        run: pip install "mkdocs==$MKDOCS_VERSION" "mkdocs-material==$MATERIAL_VERSION" "mike==$MIKE_VERSION"

      - name: Git config
        run: .ci/ci/docs-git-config.sh

      - name: Deploy 3.x (latest)
        if: github.event_name == 'push' || inputs.version == '3.x'
        run: |
          mkdocs build --strict
          mike deploy --update-aliases --alias-type copy --title "3.x (alpha)" 3.x latest

      - name: Deploy 2.x
        if: github.event_name == 'workflow_dispatch' && inputs.version == '2.x'
        run: |
          # the 2.x mkdocs.yml has no version selector, so add it here
          printf 'INHERIT: mkdocs.yml\nextra:\n  version:\n    provider: mike\n' > mkdocs.mike.yml
          mike deploy -F mkdocs.mike.yml --title "2.x" 2.x

      # Old links like /the-basic/routing/ become redirect pages, and the
      # root index.html, 404.html, CNAME and robots.txt are written.
      - name: Redirect old links and keep CNAME
        run: .ci/ci/docs-redirects.sh
