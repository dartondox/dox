name: Test

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    services:

      mariadb:
        image: mariadb:latest
        ports:
          - 3306:3306
        env:
          MYSQL_USER: dox
          MYSQL_PASSWORD: password
          MYSQL_DATABASE: dox-framework
          MYSQL_ROOT_PASSWORD: password
        options: >-
          --health-cmd="healthcheck.sh 
          --connect 
          --innodb_initialized" 
          --health-interval=10s 
          --health-timeout=5s 
          --health-retries=3

      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: postgres        
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # MySQL 8.4 with the default caching_sha2_password login
      mysql84:
        image: mysql:8.4
        ports:
          - 3307:3306
        env:
          MYSQL_USER: dox
          MYSQL_PASSWORD: password
          MYSQL_DATABASE: dox-framework
          MYSQL_ROOT_PASSWORD: password
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -udox -ppassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3
    # sqlite tests load the system libsqlite3.so (package sqlite3 v2)
    - name: Install libsqlite3
      run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
    - uses: dart-lang/setup-dart@v1
      with:
        sdk: stable
    - name: Activate melos
      run: dart pub global activate melos
    - name: Melos Bootstrap
      run: melos bs
    - name: Copy .env.example to .env of app
      run: cp packages/dox-app/.env.example packages/dox-app/.env
    - name: Copy .env.example to .env of cli
      run: cp packages/dox-cli/.env.example packages/dox-cli/.env
    - name: Run Tests
      run: melos test --no-select
    - name: Run Test (query builder postgres)
      run: DB_PORT=5432 melos test_pg
    - name: Run Test (query builder mariadb)
      run: DB_USER=dox DB_PORT=3306 melos test_mysql
    - name: Run Test (query builder mysql 8.4)
      run: DB_USER=dox DB_PORT=3307 melos test_mysql
    - name: Run Test (query builder sqlite)
      working-directory: packages/dox-query-builder
      run: DRIVER=sqlite dart test --concurrency=1
    - name: Run Test (migration mysql 8.4)
      working-directory: packages/dox-migration
      run: MYSQL_PORT=3307 dart test
