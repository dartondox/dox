name: Test

on:
  push:

# A new push to a branch cancels the old run of that branch.
# Runs on develop are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

jobs:
  # Docs-only changes (*.md, docs/, mkdocs.yml, overrides/) skip lint, tests
  # and examples. The `test` job still runs and passes, so the required check
  # is not stuck. A branch is compared with develop, so one docs-only push on
  # top of code commits still runs every test.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: ci/changes.sh

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      # The repo is a Dart pub workspace. One `dart pub get` at the root
      # is all that `melos bootstrap` does.
      - run: dart pub get
      - name: Analyze
        run: dart run melos run analyze
      - name: Check format
        run: dart format --output=none --set-exit-if-changed .

  tests:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # packages: folders under packages/ to run `dart test` in.
        # vars: env vars for `dart test`.
        # services: containers to start (postgres, mariadb, mysql84, redis, minio).
        include:
          # the default server is native (dox_http_native, built by its
          # build hook). DOX_SERVER=dartio runs dox_core on dart:io too.
          - { name: 'core (native)', packages: dox-core }
          - { name: 'core (dart:io)', packages: dox-core, vars: DOX_SERVER=dartio }
          - { name: 'app', packages: dox-app, services: redis }
          - { name: 'builder, cli', packages: 'dox-builder dox-cli' }
          - { name: 'small packages', packages: 'dox-annotation dox-auth dox-openapi dox-validation dox-http-native' }
          - { name: 'redis (cache, socketio, websocket)', packages: 'dox-cache dox-socketio dox-websocket', services: redis }
          - { name: 'storage (minio)', packages: dox-storage, services: minio }
          # the default database drivers are native (dox_postgres_native and
          # dox_mysql_native, built by their build hooks with cargo).
          # DOX_DB_DRIVER=dart runs the same tests on the Dart drivers.
          - { name: 'orm (postgres)', packages: dox-orm dox-postgres-native, vars: DRIVER=postgres DB_PORT=5432, services: postgres }
          - { name: 'orm (postgres, dart driver)', packages: dox-orm, vars: DRIVER=postgres DB_PORT=5432 DOX_DB_DRIVER=dart, services: postgres }
          - { name: 'orm (mariadb)', packages: dox-orm dox-mysql-native, vars: DRIVER=mysql DB_USER=dox DB_PORT=3306, services: mariadb }
          - { name: 'orm (mariadb, dart driver)', packages: dox-orm, vars: DRIVER=mysql DB_USER=dox DB_PORT=3306 DOX_DB_DRIVER=dart, services: mariadb }
          - { name: 'orm (mysql 8.4)', packages: dox-orm dox-mysql-native, vars: DRIVER=mysql DB_USER=dox DB_PORT=3307, services: mysql84 }
          - { name: 'orm (mysql 8.4, dart driver)', packages: dox-orm, vars: DRIVER=mysql DB_USER=dox DB_PORT=3307 DOX_DB_DRIVER=dart, services: mysql84 }
          # sqlite3 v3 bundles SQLite with a build hook. No system library needed.
          - { name: 'orm (sqlite)', packages: dox-orm, vars: DRIVER=sqlite }
          # the migration tests run on postgres, mysql and sqlite in one run
          - { name: 'migration (mariadb)', packages: dox-migration, services: postgres mariadb }
          - { name: 'migration (mysql 8.4)', packages: dox-migration, vars: MYSQL_PORT=3307, services: postgres mysql84 }
    steps:
      - uses: actions/checkout@v7
      # Start the containers first. They boot while the next steps run.
      - name: Start services
        if: matrix.services
        run: ci/start-services.sh ${{ matrix.services }}
      # dox_socketio interop tests run the real socket.io-client in node
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      # The build hooks of the native packages run `cargo build` (no release
      # binaries yet). The runner has Rust. This keeps the cargo builds.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/dox-http-native/native -> ../../../.dart_tool/hooks_runner/shared/dox_http_native/build/cargo
            packages/dox-postgres-native/native -> ../../../.dart_tool/hooks_runner/shared/dox_postgres_native/build/cargo
            packages/dox-mysql-native/native -> ../../../.dart_tool/hooks_runner/shared/dox_mysql_native/build/cargo
      - run: cargo --version
      - run: dart pub get
      - name: Copy .env.example to .env of app and cli
        run: |
          cp packages/dox-app/.env.example packages/dox-app/.env
          cp packages/dox-cli/.env.example packages/dox-cli/.env
      - name: Wait for services
        if: matrix.services
        run: ci/wait-services.sh ${{ matrix.services }}
      - name: Run tests
        env:
          TEST_PACKAGES: ${{ matrix.packages }}
          TEST_VARS: ${{ matrix.vars }}
        run: ci/run-tests.sh

  # The apps in examples/ hold the code of docs/tutorial and docs/guides.
  # They use the local packages (pubspec_overrides.yaml) and SQLite, so
  # they need no database service. A broken docs example fails CI.
  examples:
    name: example (${{ matrix.example }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [blog-api, guides]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      # The build hooks of the native packages may run `cargo build`.
      # The example has its own .dart_tool, so the cargo folders are there.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/dox-http-native/native -> ../../../examples/${{ matrix.example }}/.dart_tool/hooks_runner/shared/dox_http_native/build/cargo
            packages/dox-postgres-native/native -> ../../../examples/${{ matrix.example }}/.dart_tool/hooks_runner/shared/dox_postgres_native/build/cargo
            packages/dox-mysql-native/native -> ../../../examples/${{ matrix.example }}/.dart_tool/hooks_runner/shared/dox_mysql_native/build/cargo
      - run: cp .env.example .env
      - run: dart pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart analyze --fatal-infos
      - run: dart test --concurrency=1

  # The required check on develop is named "test". This job keeps that name
  # and fails when any job above fails.
  test:
    if: always()
    needs: [changes, lint, tests, examples]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo all green
