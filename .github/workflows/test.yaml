name: Test

on:
  push:

# A new push to a branch cancels the old run of that branch.
# Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Picks the jobs to run (ci/changes.sh and ci/affected.py).
  # Docs-only changes (*.md, docs/, mkdocs.yml, requirements-docs.txt, overrides/) skip lint, tests
  # and examples. A change in packages/ or examples/ runs only the tests of
  # the changed packages and of every package that depends on them. Any
  # other change (ci/, .github/, root pubspec, ...) and tags run everything.
  # Skipped jobs pass, so the required `test` check is not stuck. A branch
  # is compared with main, so one docs-only push on top of code commits
  # still runs the tests of that code.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      unit: ${{ steps.diff.outputs.unit }}
      unit_services: ${{ steps.diff.outputs.unit_services }}
      databases: ${{ steps.diff.outputs.databases }}
      databases_services: ${{ steps.diff.outputs.databases_services }}
      examples: ${{ steps.diff.outputs.examples }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: ci/changes.sh

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      # The repo is a Dart pub workspace. One `dart pub get` at the root
      # is all that `melos bootstrap` does.
      - run: dart pub get
      - name: Analyze
        run: dart run melos run analyze
      - name: Check format
        run: dart format --output=none --set-exit-if-changed .

  # The test entries are in ci/test-matrix.json. Each entry has:
  # - packages: folders under packages/ to run `dart test` in.
  # - vars: env vars for `dart test`.
  # - services: containers to start (postgres, mariadb, mysql84, redis, minio).
  # - group: the job that runs it, `unit` or `databases`.
  # - locks: what the entry can not share with another entry at the same
  #   time, like one database. See ci/run-group.py.
  # Notes on the entries:
  # - The server is native (dox_http_native). Its build hook downloads a
  #   ready-built library.
  #   There is no dart:io server.
  # - The Postgres and MySQL drivers are native (dox_postgres_native and
  #   dox_mysql_native). Their build hooks download ready-built libraries.
  #   There are no Dart drivers for them.
  # - sqlite3 v3 bundles SQLite with a build hook. No system library needed.
  # - The migration tests run on postgres, mysql and sqlite in one run.
  #
  # Few big jobs, not one job per entry: each job waits in the queue and
  # pays about 30s of setup. In a job, ci/run-group.py runs the entries in
  # parallel, each in its own copy of the repo, so they share no files.
  # A group job is skipped when no entry of it is picked.

  # Entries with no database. Redis is started when an entry needs it.
  unit:
    needs: changes
    if: needs.changes.outputs.unit != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start services
        if: needs.changes.outputs.unit_services != ''
        run: ci/start-services.sh ${{ needs.changes.outputs.unit_services }}
      # dox_socketio interop tests run the real socket.io-client in node
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - run: dart pub get
      - name: Copy .env.example to .env of cli
        run: |
          cp packages/dox-cli/.env.example packages/dox-cli/.env
          # .env.example ships an empty APP_KEY, so CI makes its own.
          key=$(openssl rand -hex 16)
          sed -i "s/^APP_KEY=.*/APP_KEY=$key/" packages/dox-cli/.env
      - name: Wait for services
        if: needs.changes.outputs.unit_services != ''
        run: ci/wait-services.sh ${{ needs.changes.outputs.unit_services }}
      - name: Run tests
        env:
          ENTRIES: ${{ needs.changes.outputs.unit }}
        run: ci/run-group.py

  # Entries on postgres, mariadb, mysql 8.4 and minio. Each service starts
  # once. Entries on other databases run at the same time. Entries on the
  # same database run one after the other (their `locks`).
  databases:
    needs: changes
    if: needs.changes.outputs.databases != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Start the containers first. They boot while the next steps run.
      - name: Start services
        run: ci/start-services.sh ${{ needs.changes.outputs.databases_services }}
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - run: dart pub get
      - name: Wait for services
        run: ci/wait-services.sh ${{ needs.changes.outputs.databases_services }}
      - name: Run tests
        env:
          ENTRIES: ${{ needs.changes.outputs.databases }}
        run: ci/run-group.py

  # The apps in examples/ hold the code of docs/tutorial and docs/guides.
  # They use the local packages (pubspec_overrides.yaml) and SQLite, so
  # they need no database service. A broken docs example fails CI.
  # One job runs the picked examples one after the other.
  examples:
    needs: changes
    if: needs.changes.outputs.examples != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - run: ci/run-examples.sh ${{ needs.changes.outputs.examples }}

  # A new app made with `dox create` from the template branch v3.x, on the
  # packages of this commit: build_runner, analyze, the template tests,
  # migrate, `dox build`, then the AOT server answers its routes.
  # It catches a change that breaks apps, the template, dox_queue or
  # dox_scheduler. See ci/smoke-template.sh.
  template:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - run: ci/smoke-template.sh
        env:
          TEMPLATE_VERSION: v3.x

  # The required check on main is named "test". This job keeps that name
  # and fails when any job above fails or is cancelled. Skipped jobs pass.
  test:
    if: always()
    needs: [changes, lint, unit, databases, examples, template]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo all green
