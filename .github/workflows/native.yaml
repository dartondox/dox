name: Native

# The Rust libraries: dox_http_native (HTTP server), dox_postgres_native
# (Postgres driver) and dox_mysql_native (MySQL and MariaDB driver).
# Each has the same jobs.
#
# dox_http_native: the Rust HTTP library.
#
# Every push that changes it: build the library on Linux, run the Rust and
# Dart tests.
#
# A tag like `dox_http_native-v3.0.0-alpha.2`: build the library for the 5
# targets and upload them to a GitHub release of that tag, with SHA256SUMS.
# Then fill `_sha256` in packages/dox-http-native/hook/build.dart before you
# publish the package: `dart run bin/native_hashes.dart <tag>`. The hook
# downloads these files, so users do not need Rust.

on:
  push:
    # docs-only pushes skip this. GitHub ignores paths on tag pushes,
    # so release tags always build.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'overrides/**'

permissions:
  contents: read

jobs:
  # The test jobs run only when their package changed, or when a shared
  # file changed (ci/, .github/, root pubspec, ...). Tags run them all.
  # See ci/changes.sh and ci/affected.py.
  changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: ci/changes.sh

  test:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changed), 'dox-http-native')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      # the Dart build hook uses native/target/release when it is there
      - name: Rust checks
        run: ci/rust-check.sh dox-http-native
      - name: Dart tests
        run: ci/native-dart-tests.sh dox-http-native

  build:
    if: startsWith(github.ref, 'refs/tags/dox_http_native-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, file: libdox_http_native.dylib, asset: dox_http_native-macos-arm64.dylib }
          - { os: macos-latest, target: x86_64-apple-darwin, file: libdox_http_native.dylib, asset: dox_http_native-macos-x64.dylib }
          # 22.04: an older glibc, so the library loads on more Linux systems
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, file: libdox_http_native.so, asset: dox_http_native-linux-x64.so }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, file: libdox_http_native.so, asset: dox_http_native-linux-arm64.so }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, file: dox_http_native.dll, asset: dox_http_native-windows-x64.dll }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          FILE: ${{ matrix.file }}
          ASSET: ${{ matrix.asset }}
        run: bash ci/native-build.sh dox-http-native
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ci
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: ci/native-release.sh dox_http_native

  # ---- dox_postgres_native ---------------------------------------------
  #
  # Every push that changes it: Rust checks, then the Dart tests on
  # Postgres 16 (the pool tests and the dox_orm tests on the native driver).
  #
  # A tag like `dox_postgres_native-v3.0.0-alpha.2`: build the library for
  # the 5 targets and upload them to a GitHub release of that tag, with
  # SHA256SUMS. Then fill `_sha256` in
  # packages/dox-postgres-native/hook/build.dart before you publish:
  # `dart run bin/native_hashes.dart <tag>`.

  postgres-test:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changed), 'dox-postgres-native')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Postgres boots while the next steps run
      - name: Start Postgres 16
        run: ci/start-services.sh postgres
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Wait for Postgres
        run: ci/wait-services.sh postgres
      # the Dart build hook uses native/target/release when it is there
      - name: Rust checks
        env:
          PG_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: ci/rust-check.sh dox-postgres-native --release
      - name: Dart tests
        run: ci/native-dart-tests.sh dox-postgres-native

  postgres-build:
    if: startsWith(github.ref, 'refs/tags/dox_postgres_native-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, file: libdox_postgres_native.dylib, asset: dox_postgres_native-macos-arm64.dylib }
          - { os: macos-latest, target: x86_64-apple-darwin, file: libdox_postgres_native.dylib, asset: dox_postgres_native-macos-x64.dylib }
          # 22.04: an older glibc, so the library loads on more Linux systems
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, file: libdox_postgres_native.so, asset: dox_postgres_native-linux-x64.so }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, file: libdox_postgres_native.so, asset: dox_postgres_native-linux-arm64.so }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, file: dox_postgres_native.dll, asset: dox_postgres_native-windows-x64.dll }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          FILE: ${{ matrix.file }}
          ASSET: ${{ matrix.asset }}
        run: bash ci/native-build.sh dox-postgres-native
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  postgres-release:
    needs: postgres-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ci
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: ci/native-release.sh dox_postgres_native

  # ---- dox_mysql_native ------------------------------------------------
  #
  # Every push that changes it: Rust checks, then the Dart tests on
  # MySQL 8.4 and MariaDB 11
  # (the pool tests and the dox_orm tests on the native driver).
  #
  # A tag like `dox_mysql_native-v3.0.0-alpha.2`: build the library for the
  # 5 targets and upload them to a GitHub release of that tag, with
  # SHA256SUMS. Then fill `_sha256` in
  # packages/dox-mysql-native/hook/build.dart before you publish:
  # `dart run bin/native_hashes.dart <tag>`.

  mysql-test:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changed), 'dox-mysql-native')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the databases boot while the next steps run.
      # mysql84: caching_sha2_password, the default login of MySQL 8.4
      - name: Start MySQL 8.4 and MariaDB 11
        run: ci/start-services.sh mariadb mysql84
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Rust checks
        run: ci/rust-check.sh dox-mysql-native --release
      - name: Wait for the databases
        run: ci/wait-services.sh mariadb mysql84
      # the Dart build hook uses native/target/release when it is there
      - name: Dart tests
        run: ci/native-dart-tests.sh dox-mysql-native

  mysql-build:
    if: startsWith(github.ref, 'refs/tags/dox_mysql_native-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, file: libdox_mysql_native.dylib, asset: dox_mysql_native-macos-arm64.dylib }
          - { os: macos-latest, target: x86_64-apple-darwin, file: libdox_mysql_native.dylib, asset: dox_mysql_native-macos-x64.dylib }
          # 22.04: an older glibc, so the library loads on more Linux systems
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, file: libdox_mysql_native.so, asset: dox_mysql_native-linux-x64.so }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, file: libdox_mysql_native.so, asset: dox_mysql_native-linux-arm64.so }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, file: dox_mysql_native.dll, asset: dox_mysql_native-windows-x64.dll }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          FILE: ${{ matrix.file }}
          ASSET: ${{ matrix.asset }}
        run: bash ci/native-build.sh dox-mysql-native
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  mysql-release:
    needs: mysql-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ci
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: ci/native-release.sh dox_mysql_native
