name: Native

# The Rust libraries: dox_http_native (HTTP server), dox_postgres_native
# (Postgres driver) and dox_mysql_native (MySQL and MariaDB driver).
# Each has the same jobs.
#
# dox_http_native: the Rust HTTP library.
#
# Every push: build the library on Linux, run the Rust and Dart tests.
#
# A tag like `dox_http_native-v3.0.0-alpha.2`: build the library for the 5
# targets and upload them to a GitHub release of that tag, with SHA256SUMS.
# Then fill `_sha256` in packages/dox-http-native/hook/build.dart before you
# publish the package: `dart run bin/native_hashes.dart <tag>`. The hook
# downloads these files, so users do not need Rust.

on:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Rust checks
        working-directory: packages/dox-http-native/native
        run: |
          cargo fmt --check
          cargo clippy --release --all-targets -- -D warnings
          cargo test
          cargo build --release
      # the build hook uses native/target/release when it is there
      - name: Dart tests
        working-directory: packages/dox-http-native
        run: |
          dart pub get
          dart analyze --fatal-infos .
          dart test --concurrency=1

  build:
    if: startsWith(github.ref, 'refs/tags/dox_http_native-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, file: libdox_http_native.dylib, asset: dox_http_native-macos-arm64.dylib }
          - { os: macos-latest, target: x86_64-apple-darwin, file: libdox_http_native.dylib, asset: dox_http_native-macos-x64.dylib }
          # 22.04: an older glibc, so the library loads on more Linux systems
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, file: libdox_http_native.so, asset: dox_http_native-linux-x64.so }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, file: libdox_http_native.so, asset: dox_http_native-linux-arm64.so }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, file: dox_http_native.dll, asset: dox_http_native-windows-x64.dll }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        working-directory: packages/dox-http-native/native
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }}
          mkdir -p ../../../dist
          cp target/${{ matrix.target }}/release/${{ matrix.file }} ../../../dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum dox_http_native-* > SHA256SUMS
          cat SHA256SUMS
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" * --clobber --repo "$GITHUB_REPOSITORY"
          else
            # never "latest": that stays the framework release.
            # a version with "-" (like 3.0.0-alpha.2) is a prerelease.
            pre=""
            case "$TAG" in *-v*-*) pre="--prerelease" ;; esac
            gh release create "$TAG" * --repo "$GITHUB_REPOSITORY" $pre --latest=false \
              --title "$TAG" --notes "Ready-built dox_http_native libraries. See SHA256SUMS."
          fi

  # ---- dox_postgres_native ---------------------------------------------
  #
  # Every push: Rust checks, then the Dart tests on Postgres 16 (the pool
  # tests and the dox_orm tests on the native driver).
  #
  # A tag like `dox_postgres_native-v3.0.0-alpha.2`: build the library for
  # the 5 targets and upload them to a GitHub release of that tag, with
  # SHA256SUMS. Then fill `_sha256` in
  # packages/dox-postgres-native/hook/build.dart before you publish:
  # `dart run bin/native_hashes.dart <tag>`.

  postgres-test:
    runs-on: ubuntu-latest
    steps:
      # Postgres boots while the next steps run
      - name: Start Postgres 16
        run: |
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_DB=postgres -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            --health-cmd pg_isready --health-interval 2s postgres:16
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Wait for Postgres
        run: timeout 90 sh -c "until [ \"\$(docker inspect -f '{{.State.Health.Status}}' postgres)\" = healthy ]; do sleep 1; done"
      - name: Rust checks
        working-directory: packages/dox-postgres-native/native
        env:
          PG_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          cargo fmt --check
          cargo clippy --release --all-targets -- -D warnings
          cargo test --release
          cargo build --release
      # the build hook uses native/target/release when it is there
      - name: Dart tests
        working-directory: packages/dox-postgres-native
        run: |
          dart pub get
          dart analyze --fatal-infos .
          DRIVER=postgres DB_PORT=5432 dart test --concurrency=1

  postgres-build:
    if: startsWith(github.ref, 'refs/tags/dox_postgres_native-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, file: libdox_postgres_native.dylib, asset: dox_postgres_native-macos-arm64.dylib }
          - { os: macos-latest, target: x86_64-apple-darwin, file: libdox_postgres_native.dylib, asset: dox_postgres_native-macos-x64.dylib }
          # 22.04: an older glibc, so the library loads on more Linux systems
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, file: libdox_postgres_native.so, asset: dox_postgres_native-linux-x64.so }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, file: libdox_postgres_native.so, asset: dox_postgres_native-linux-arm64.so }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, file: dox_postgres_native.dll, asset: dox_postgres_native-windows-x64.dll }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        working-directory: packages/dox-postgres-native/native
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }}
          mkdir -p ../../../dist
          cp target/${{ matrix.target }}/release/${{ matrix.file }} ../../../dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  postgres-release:
    needs: postgres-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum dox_postgres_native-* > SHA256SUMS
          cat SHA256SUMS
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" * --clobber --repo "$GITHUB_REPOSITORY"
          else
            # never "latest": that stays the framework release.
            # a version with "-" (like 3.0.0-alpha.2) is a prerelease.
            pre=""
            case "$TAG" in *-v*-*) pre="--prerelease" ;; esac
            gh release create "$TAG" * --repo "$GITHUB_REPOSITORY" $pre --latest=false \
              --title "$TAG" --notes "Ready-built dox_postgres_native libraries. See SHA256SUMS."
          fi

  # ---- dox_mysql_native ------------------------------------------------
  #
  # Every push: Rust checks, then the Dart tests on MySQL 8.4 and MariaDB 11
  # (the pool tests and the dox_orm tests on the native driver).
  #
  # A tag like `dox_mysql_native-v3.0.0-alpha.2`: build the library for the
  # 5 targets and upload them to a GitHub release of that tag, with
  # SHA256SUMS. Then fill `_sha256` in
  # packages/dox-mysql-native/hook/build.dart before you publish:
  # `dart run bin/native_hashes.dart <tag>`.

  mysql-test:
    runs-on: ubuntu-latest
    steps:
      # the databases boot while the next steps run
      - name: Start MySQL 8.4 and MariaDB 11
        run: |
          docker run -d --name mariadb -p 3306:3306 \
            -e MYSQL_USER=dox -e MYSQL_PASSWORD=password -e MYSQL_DATABASE=dox-framework -e MYSQL_ROOT_PASSWORD=password \
            --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 2s mariadb:11
          # caching_sha2_password, the default login of MySQL 8.4
          docker run -d --name mysql84 -p 3307:3306 \
            -e MYSQL_USER=dox -e MYSQL_PASSWORD=password -e MYSQL_DATABASE=dox-framework -e MYSQL_ROOT_PASSWORD=password \
            --health-cmd "mysqladmin ping -h127.0.0.1 -udox -ppassword" --health-interval 2s mysql:8.4
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Rust checks
        working-directory: packages/dox-mysql-native/native
        run: |
          cargo fmt --check
          cargo clippy --release --all-targets -- -D warnings
          cargo test --release
          cargo build --release
      - name: Wait for the databases
        run: |
          for s in mariadb mysql84; do
            timeout 90 sh -c "until [ \"\$(docker inspect -f '{{.State.Health.Status}}' $s)\" = healthy ]; do sleep 1; done"
          done
      # the build hook uses native/target/release when it is there
      - name: Dart tests
        working-directory: packages/dox-mysql-native
        run: |
          dart pub get
          dart analyze --fatal-infos .
          echo "::group::MariaDB 11"
          DB_PORT=3306 DB_USER=dox dart test --concurrency=1
          echo "::endgroup::"
          echo "::group::MySQL 8.4"
          DB_PORT=3307 DB_USER=dox dart test --concurrency=1
          echo "::endgroup::"

  mysql-build:
    if: startsWith(github.ref, 'refs/tags/dox_mysql_native-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, file: libdox_mysql_native.dylib, asset: dox_mysql_native-macos-arm64.dylib }
          - { os: macos-latest, target: x86_64-apple-darwin, file: libdox_mysql_native.dylib, asset: dox_mysql_native-macos-x64.dylib }
          # 22.04: an older glibc, so the library loads on more Linux systems
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, file: libdox_mysql_native.so, asset: dox_mysql_native-linux-x64.so }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, file: libdox_mysql_native.so, asset: dox_mysql_native-linux-arm64.so }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, file: dox_mysql_native.dll, asset: dox_mysql_native-windows-x64.dll }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        working-directory: packages/dox-mysql-native/native
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }}
          mkdir -p ../../../dist
          cp target/${{ matrix.target }}/release/${{ matrix.file }} ../../../dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  mysql-release:
    needs: mysql-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum dox_mysql_native-* > SHA256SUMS
          cat SHA256SUMS
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" * --clobber --repo "$GITHUB_REPOSITORY"
          else
            # never "latest": that stays the framework release.
            # a version with "-" (like 3.0.0-alpha.2) is a prerelease.
            pre=""
            case "$TAG" in *-v*-*) pre="--prerelease" ;; esac
            gh release create "$TAG" * --repo "$GITHUB_REPOSITORY" $pre --latest=false \
              --title "$TAG" --notes "Ready-built dox_mysql_native libraries. See SHA256SUMS."
          fi
