name: Release

# Push a tag like v<version> to publish all packages to pub.dev.
# Run it by hand (workflow_dispatch) to do a dry run only. Nothing is published then.
# On a tag, the Test workflow runs first and must pass, or nothing is
# published. On a tag, lint and the unit tests use pub.dev only (see
# ci/use-siblings.sh). The examples and template jobs still use the
# sibling clones on main (see test.yaml).

on:
  push:
    tags:
      - 'dox_annotation-v*'
      - 'dox_builder-v*'
      - 'dox_cache-v*'
      - 'dox_core-v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to dry run (all = every package)'
        type: choice
        options:
          - all
          - dox_annotation
          - dox_builder
          - dox_cache
          - dox_core
        default: all

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Folder:package to release (the tagged one, or the dry run
      # input). Sets PACKAGES for the next steps.
      - name: Packages to release
        env:
          PACKAGE: ${{ inputs.package }}
        run: ci/publish-order.sh
      - name: Check that the tag matches the package version
        run: ci/check-versions.sh

  dry-run:
    if: github.event_name == 'workflow_dispatch'
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Folder:package to release. Sets PACKAGES for the next steps.
      - name: Packages to release
        env:
          PACKAGE: ${{ inputs.package }}
        run: ci/publish-order.sh
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      # Pub workspace: one `dart pub get` at the root links all local packages,
      # so unpublished sibling versions resolve.
      - name: Resolve the workspace
        run: dart pub get
      - name: Dry run publish
        run: ci/publish-dry-run.sh

  # Read access only. The tests run a lot of other code, so they must not
  # get the pub.dev token.
  test:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    uses: ./.github/workflows/test.yaml
    permissions:
      contents: read

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [check-version, test]
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write # pub.dev automated publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The tagged package only. Sets PACKAGES for the next steps.
      - name: Package to release
        run: ci/publish-order.sh
      # Sets up the OIDC token for pub.dev. No PUB_CREDENTIALS secret needed.
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      # Check the package before it is uploaded. The workspace links
      # the local siblings, so this needs no wait for pub.dev. The uploads
      # then skip this check (--skip-validation), see ci/publish.sh.
      - name: Resolve the workspace
        run: dart pub get
      - name: Check the package (dry run)
        run: ci/publish-dry-run.sh
      - name: Publish the package
        run: ci/publish.sh
