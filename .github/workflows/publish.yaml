name: Release

# Push a tag like v<version> to publish all packages to pub.dev.
# Run it by hand (workflow_dispatch) to do a dry run only. Nothing is published then.
# On a tag, the Test workflow runs first and must pass, or nothing is
# published. On a tag, lint and the unit tests use pub.dev only (see
# ci/use-siblings.sh). The examples and template jobs still use the
# sibling clones on main (see test.yaml).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Folder:package, in publish order. Sets PACKAGES for the next steps.
      - name: Publish order
        run: ci/publish-order.sh
      - name: Check that tag and all package versions match the root version
        run: ci/check-versions.sh

  dry-run:
    if: github.event_name == 'workflow_dispatch'
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Folder:package, in publish order. Sets PACKAGES for the next steps.
      - name: Publish order
        run: ci/publish-order.sh
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      # Pub workspace: one `dart pub get` at the root links all local packages,
      # so unpublished sibling versions resolve.
      - name: Resolve the workspace
        run: dart pub get
      - name: Dry run publish
        run: ci/publish-dry-run.sh

  # Read access only. The tests run a lot of other code, so they must not
  # get the pub.dev token.
  test:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    uses: ./.github/workflows/test.yaml
    permissions:
      contents: read

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [check-version, test]
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write # pub.dev automated publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v7
      # Folder:package, in publish order. Sets PACKAGES for the next steps.
      - name: Publish order
        run: ci/publish-order.sh
      # Sets up the OIDC token for pub.dev. No PUB_CREDENTIALS secret needed.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      # Check every package before anything is uploaded. The workspace links
      # the local siblings, so this needs no wait for pub.dev. The uploads
      # then skip this check (--skip-validation), see ci/publish.sh.
      - name: Resolve the workspace
        run: dart pub get
      - name: Check every package (dry run)
        run: ci/publish-dry-run.sh
      - name: Publish packages in order
        run: ci/publish.sh
