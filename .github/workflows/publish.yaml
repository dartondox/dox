name: Release

# Push a tag like v3.0.0-alpha.1 to publish all packages to pub.dev.
# Run it by hand (workflow_dispatch) to do a dry run only. Nothing is published then.
# Tests are not run here. The Test workflow runs on every push, so wait for it
# to be green on the release commit before you push the tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write # pub.dev automated publishing (OIDC)
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Folder:package, in publish order. Sets PACKAGES for the next steps.
      - name: Publish order
        run: ci/publish-order.sh
      - name: Check that tag and all package versions match the root version
        run: ci/check-versions.sh

  dry-run:
    if: github.event_name == 'workflow_dispatch'
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Folder:package, in publish order. Sets PACKAGES for the next steps.
      - name: Publish order
        run: ci/publish-order.sh
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      # Pub workspace: one `dart pub get` at the root links all local packages,
      # so unpublished sibling versions resolve.
      - name: Resolve the workspace
        run: dart pub get
      - name: Dry run publish
        run: ci/publish-dry-run.sh

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: check-version
    runs-on: ubuntu-latest
    environment: pub.dev
    steps:
      - uses: actions/checkout@v4
      # Folder:package, in publish order. Sets PACKAGES for the next steps.
      - name: Publish order
        run: ci/publish-order.sh
      # Sets up the OIDC token for pub.dev. No PUB_CREDENTIALS secret needed.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Publish packages in order
        run: ci/publish.sh
