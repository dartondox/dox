name: Docs check

# Every pull request that touches the docs: the strict build must pass
# (broken links and anchors fail it) and the text has no known typos.
# Deploys happen in docs.yaml, on push to main.

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'hooks/**'
      - 'overrides/**'
      - 'packages/*/CHANGELOG.md'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs-check.yaml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install mkdocs and material
        run: pip install -r requirements-docs.txt codespell==2.4.3
      - name: Strict build
        run: mkdocs build --strict
      - name: Spelling
        run: codespell docs --skip "*.svg,*.png,*.ico,*.css,*.js" --ignore-words .codespell-ignore
      - name: No content tabs
        run: ci/check-no-tabs.sh
