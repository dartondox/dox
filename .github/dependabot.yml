version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # all steps of codeql-action must have the same version: one PR for all
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
  - package-ecosystem: pub
    directory: "/"
    schedule:
      interval: weekly
