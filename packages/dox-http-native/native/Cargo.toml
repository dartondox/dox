[package]
name = "dox_http_native"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
bytes = "1.12.1"
flate2 = "1.1.10"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
slab = "0.4.12"
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.54.0", features = ["rt", "net", "sync", "macros", "time", "io-util"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[dev-dependencies]
# paused time, so the timeout tests do not wait for real
tokio = { version = "1.54.0", features = ["test-util"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
