# dox_core only uses the generator for the DTOs of its tests and benchmark.
targets:
  $default:
    sources:
      - lib/**
      - test/dtos/**
      - benchmark/**
      - $package$
    builders:
      # the model and DTO builder runs on lib/** by default. The DTOs of
      # the tests and the benchmark are outside lib/.
      dox_builder:
        generate_for:
          - lib/**
          - test/dtos/**
          - benchmark/**
      dox_builder:openapi:
        enabled: false
      dox_builder:dtos:
        enabled: false
