targets:
  $default:
    builders:
      dox_builder|annotations:
        enabled: true

builders:
  dox_builder:
    target: ":dox_builder"
    import: "package:dox_builder/dox_builder.dart"
    builder_factories: ["buildDoxModel"]
    build_extensions: { ".dart": [".g.dart", ".dox_model_generator.g.part"] }
    auto_apply: dependents
    build_to: cache
    applies_builders: ["source_gen|combining_builder"]

  # lib/openapi.g.dart: the OpenAPI docs of the app, see dox_openapi
  openapi:
    import: "package:dox_builder/dox_builder.dart"
    builder_factories: ["buildDoxOpenApi"]
    build_extensions: { "$lib$": ["openapi.g.dart"] }
    auto_apply: dependents
    build_to: source

  # lib/dtos.g.dart: every @Dto of the app, for AppConfig(dtos: dtos)
  dtos:
    import: "package:dox_builder/dox_builder.dart"
    builder_factories: ["buildDoxDtos"]
    build_extensions: { "$lib$": ["dtos.g.dart"] }
    auto_apply: dependents
    build_to: source
