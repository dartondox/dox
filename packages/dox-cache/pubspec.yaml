name: dox_cache
description: Cache for Dart and the Dox framework. Memory, file and Redis drivers, TTL, locks, tags and remember helpers.
version: 3.1.3
repository: https://github.com/dartondox/dox
homepage: https://dartondox.dev

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  # Raise to the dox_annotation release that has install.dart before
  # releasing this package.
  dox_annotation: ^3.1.3
  crypto: ^3.0.8
  ioredis: ^3.0.2

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0

# The `dox` CLI finds the commands of this package here (`dox cache:install`).
dox:
  commands: package:dox_cache/commands.dart
