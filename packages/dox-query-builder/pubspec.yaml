  mysql_dart: ^3.0.1
  sqlite3: ^2.9.4
  dox_annotation: ^1.0.5
  
dev_dependencies:
  lints: ^2.0.0
  test: ^1.21.0
  build_runner: ^2.3.3
  dox_builder: ^2.0.0
