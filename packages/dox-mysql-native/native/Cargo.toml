[package]
name = "dox_mysql_native"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# rustls + ring for TLS, flate2 in pure Rust: no system libraries needed
mysql_async = { version = "0.37.1", default-features = false, features = ["default-rustls-ring"] }
slab = "0.4.12"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "macros", "time"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
