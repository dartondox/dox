name: dox_mysql_native
description: Fast native MySQL and MariaDB driver for Dart and the Dox ORM. Rust (mysql_async) runs the pool and a prepared statement cache. Dart gets typed rows.
version: 3.0.0-alpha.2
repository: https://github.com/dartondox/dox
homepage: https://dartondox.dev

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  code_assets: ^2.1.0
  crypto: ^3.0.7
  dox_orm: ^3.0.0-alpha.2
  hooks: ^2.2.0
  mysql_dart: ^3.0.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
