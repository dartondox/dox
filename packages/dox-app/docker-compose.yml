services:

  # Http server
  dox:
    # the app is part of the dox pub workspace, so build from the repo root
    build:
      context: ../..
      dockerfile: packages/dox-app/Dockerfile
    hostname: dox
    # config is read from env vars; the image has no .env file
    env_file: .env
    environment:
      - DB_HOST=postgres
    restart: unless-stopped
    ports:
      # export:internal
      - "${APP_PORT}:${APP_PORT}"
    depends_on:
      postgres:
        condition: service_healthy

  # Postgres database
  postgres:
    image: postgres:14.1
    volumes:
      - ../.docker/build/postgres:/var/lib/postgresql/data
    environment: 
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    expose:
      - ${DB_PORT}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    command: -p ${DB_PORT}
    restart: always
    healthcheck:
      test: ['CMD', 'pg_isready', '-q', '-U', 'postgres', '-p', '${DB_PORT}']
      interval: 5s
      retries: 5
