[package]
name = "dox_postgres_native"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
bytes = "1.12.1"
deadpool-postgres = "0.14.2"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "sync", "time"] }
tokio-postgres = "0.7.18"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
