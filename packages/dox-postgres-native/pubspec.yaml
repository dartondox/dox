name: dox_postgres_native
description: Fast native Postgres driver for Dart and the Dox ORM. Rust (tokio-postgres) owns the connections, your code stays in Dart.
version: 3.0.0-alpha.2
repository: https://github.com/dartondox/dox
homepage: https://dartondox.dev

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  code_assets: ^2.1.0
  crypto: ^3.0.7
  dox_orm: ^3.0.0-alpha.2
  hooks: ^2.2.0
  postgres: ^3.5.20

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
