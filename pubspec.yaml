name: dox_framework
publish_to: 'none'
version: 3.0.0-alpha.10

environment:
  sdk: ^3.13.0

# Dart pub workspace: one `dart pub get` at the root links all packages
# and writes one pubspec.lock.
workspace:
  - packages/dox-annotation
  - packages/dox-auth
  - packages/dox-builder
  - packages/dox-cache
  - packages/dox-cli
  - packages/dox-core
  - packages/dox-migration
  - packages/dox-openapi
  - packages/dox-orm
  - packages/dox-query-builder
  - packages/dox-socketio
  - packages/dox-storage
  - packages/dox-validation

dev_dependencies:
  melos: ^8.9.0

melos:
  command:
    run:
      # scripts run on all matching packages, no package prompt
      noSelect: true

  # `melos test` is a built-in command in melos 8. Use `melos run test`.
  scripts:
    analyze:
      exec: dart analyze --fatal-infos .

    format_check:
      run: dart format --output=none --set-exit-if-changed .

    # one package at a time: the packages share one .dart_tool, and build
    # hooks (dox_http_native, sqlite3) that run at the same time can drop
    # each other's native assets.
    test:
      exec:
        command: dart test --concurrency=1
        concurrency: 1
      packageFilters:
        dirExists: test
        ignore:
          - dox_orm

    test_pg:
      exec: DRIVER=postgres dart test --concurrency=1
      packageFilters:
        scope: dox_orm

    test_mysql:
      exec: DRIVER=mysql dart test --concurrency=1
      packageFilters:
        scope: dox_orm

    test_sqlite:
      exec: DRIVER=sqlite dart test --concurrency=1
      packageFilters:
        scope: dox_orm
