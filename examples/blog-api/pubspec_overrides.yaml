# Use the Dox packages of this repo, not the ones on pub.dev.
# The packages of other repos come from clones next to this repo
# (../dox-orm, ../dox-auth, ../dox-openapi, ../dox-validation,
# ../dox-socketio, ../dox-storage, ../dox-queue and
# ../dox-scheduler). CI clones them with ci/clone-siblings.sh.
dependency_overrides:
  dox_annotation:
    path: ../../packages/dox-annotation
  dox_auth:
    path: ../../../dox-auth
  dox_builder:
    path: ../../packages/dox-builder
  dox_cache:
    path: ../../packages/dox-cache
  dox_core:
    path: ../../packages/dox-core
  dox_migration:
    path: ../../../dox-orm/packages/dox-migration
  dox_openapi:
    path: ../../../dox-openapi
  dox_orm:
    path: ../../../dox-orm/packages/dox-orm
  dox_queue:
    path: ../../../dox-queue
  dox_scheduler:
    path: ../../../dox-scheduler
  dox_socketio:
    path: ../../../dox-socketio
  dox_storage:
    path: ../../../dox-storage
  dox_validation:
    path: ../../../dox-validation
