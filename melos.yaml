name: dox_framework

packages:
  - packages/**

scripts:

  test:
    exec: dart test --concurrency=1
    packageFilters:
      noSelect: true
      ignore:
        - "dox_query_builder"

  test_pg:
    exec: DRIVER=postgres dart test --concurrency=1
    packageFilters:
      noSelect: true
      scope: "dox_query_builder"

  test_mysql:
    exec: DRIVER=mysql dart test --concurrency=1
    packageFilters:
      noSelect: true
      scope: "dox_query_builder"