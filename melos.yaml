name: dox_framework

packages:
  - packages/**

scripts:

  test:
    exec: dart test --concurrency=1
    packageFilters:
      ignore: "dox_query_builder"

  test_query_builder_postgres:
    exec: DRIVER=postgres DB_PORT=5433 dart test --concurrency=1
    packageFilters:
      noSelect: true
      scope: "dox_query_builder"

  test_query_builder_mysql:
    exec: DRIVER=mysql DB_PORT=3306 dart test --concurrency=1
    packageFilters:
      noSelect: true
      scope: "dox_query_builder"