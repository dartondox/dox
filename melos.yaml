name: dox_framework

packages:
  - packages/**

scripts:

  analyze:
    exec: dart analyze --fatal-infos .
    packageFilters:
      noSelect: true

  format_check:
    run: dart format --output=none --set-exit-if-changed .

  test:
    exec: dart test --concurrency=1
    packageFilters:
      noSelect: true
      dirExists: test
      ignore:
        - "dox_orm"

  test_pg:
    exec: DRIVER=postgres dart test --concurrency=1
    packageFilters:
      noSelect: true
      scope: "dox_orm"

  test_mysql:
    exec: DRIVER=mysql dart test --concurrency=1
    packageFilters:
      noSelect: true
      scope: "dox_orm"

  test_sqlite:
    exec: DRIVER=sqlite dart test --concurrency=1
    packageFilters:
      noSelect: true
      scope: "dox_orm"
